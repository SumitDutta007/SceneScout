r bare hands before the magistrate arrives.", "zone": "", "heat": 0.0}, {"id": "E12-C039", "t0": "01:00.80", "t1": "01:03.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Gerald tapping his whip against his palm and laughing heartily beside the Constable.", "zone": "", "heat": 0.5}, {"id": "E12-C040", "t0": "01:00.80", "t1": "01:03.10", "kind": "DIALOGUE", "speaker": "GERALD", "emotion": "Gleeful, Derisive", "text": "A lady's hands will be shredded to ribbons!", "zone": "", "heat": 0.0}, {"id": "E12-C041", "t0": "01:03.20", "t1": "01:05.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium three-shot of Clarissa stepping behind Juliana, as Alexander watches helplessly with dark fury.", "zone": "", "heat": 0.0}, {"id": "E12-C042", "t0": "01:03.30", "t1": "01:05.10", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Cold, Transactional", "text": "Do it, and we withdraw the charges.", "zone": "", "heat": 0.2}, {"id": "E12-C043", "t0": "01:05.20", "t1": "01:09.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Extreme close-up of Clarissa's mouth leaning directly into Juliana's ear, whispering venomously.", "zone": "cliff", "heat": 0.0}, {"id": "E12-C044", "t0": "01:05.40", "t1": "01:09.20", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Whispering, Menacing", "text": "Fail, or refuse, and your husband hangs from the gallows.", "zone": "cliff", "heat": 0.75}]}], "P07": [{"episode": 31, "start": "01:10.50", "end": "01:20.50", "heading": "INT. CASTLE SUBTERRANEAN WET CELLS – NIGHT", "file": "episode-031-Episode 1681364.txt", "cues": [{"id": "E31-C040", "t0": "01:10.50", "t1": "01:13.30", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Catherine sneering down at her.", "zone": "hook", "heat": 0.2}, {"id": "E31-C041", "t0": "01:10.80", "t1": "01:13.20", "kind": "DIALOGUE", "speaker": "CATHERINE", "emotion": "Contemptuous", "text": "A scarred nobody.", "zone": "hook", "heat": 0.5}, {"i d over Juliana with frantic fury.", "zone": "cliff", "heat": 0.0}, {"id": "E32-C113", "t0": "02:28.10", "t1": "02:31.20", "kind": "DIALOGUE", "speaker": "CATHERINE", "emotion": "Screaming, Maniacal", "text": "Then let's see how brave you are when it touches your skin!", "zone": "cliff", "heat": 0.7}, {"id": "E32-C114", "t0": "02:30.80", "t1": "02:32.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Catherine plunging the glowing orange poker straight toward Juliana's face.", "zone": "cliff", "heat": 0.0}, {"id": "E32-C115", "t0": "02:31.20", "t1": "02:34.38", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Juliana gasps, freezing as the glowing tip of the iron thrusts forward, stopping mere millimeters from her right eye.", "zone": "cliff", "heat": 0.2}, {"id": "E32-C116", "t0": "02:32.00", "t1": "02:34.38", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Extreme close-up of Juliana's wide, unblinking blue eye. The intense, fiery orange glow of the iron poker radiates inches from her cornea, holding on the heart-stopping cliffhanger as the frame cuts to black.", "zone": "cliff", "heat": 0.0}]}], "P08": [{"episode": 37, "start": "01:43.50", "end": "02:36.47", "heading": "INT. ASHBRIDGE DUNGEON – CONTINUOUS", "file": "episode-037-Episode 1681370.txt", "cues": [{"id": "E37-C056", "t0": "01:43.50", "t1": "01:48.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Full shot of Juliana using her bare hands against the slimy stone floor to drag herself upright to her knees, chains rattling loudly.", "zone": "hook", "heat": 0.5}, {"id": "E37-C057", "t0": "01:44.00", "t1": "01:47.00", "kind": "SFX", "speaker": "", "emotion": "", "text": "The harsh scrape and clatter of heavy iron chains dragging across wet stone.", "zone": "hook", "heat": 0.5}, {"id": "E37-C058", "t0": "01:45.50", "t1": "01:47.80", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Straining, Defiant Gasps", "text": "I will not!", "zone": "hook", "heat": 0.4}, {"id": "E37-C059", "t0": "01:48.50", "t1": "01:53.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Low-angle shot looking up at Juliana as she thrusts her chin high toward the iron ceiling grate, bathed in cold shafts of light.", "zone": "", "heat": 0.0}, {"id": "E37-C060", "t0": "01:49.00", "t1": "01:52.50", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Passionate Defiance", "text": "They can take my name. They can take my home.", "zone": "", "heat": 0.0}, {"id": "E37-C061", "t0": "01:53.50", "t1": "01:56.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Tight close-up of Juliana's iron-shackled hand reaching out and gripping the massive iron ring anchored into the dungeon pillar with crushing determination.", "zone": "", "heat": 0.25}, {"id": "E37-C062", "t0": "01:53.60", "t1": "01:56.20", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Indomitable Spirit", "text": "They cannot take who I am!", "zone": "", "heat": 0.0}, {"id": "E37-C063", "t0": "01:56.50", "t1": "02:00.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium two-shot in the dimly lit parlor, illuminated by the warm glow of the fireplace. Clarissa now wears a deep blue velvet gown, reclining in an armchair beside the nobleman.", "zone": "", "heat": 0.0}, {"id": "E37-C064", "t0": "01:57.20", "t1": "01:59.80", "kind": "DIALOGUE", "speaker": "NOBLEMAN", "emotion": "Quietly Skeptical", "text": "Do you think she'll actually be executed?", "zone": "", "heat": 0.3}, {"id": "E37-C065", "t0": "02:00.00", "t1": "02:04.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up of Clarissa giving a slight, dismissive scoff before turning to him with cold certainty.", "zone": "", "heat": 0.0}, {"id": "E37-C066", "t0": "02:00.50", "t1": "02:04.20", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Dismissive, Certain", "text": "After what she has been accused of? Of course.", "zone": "", "heat": 0.2}, {"id": "E37-C067", "t0": "02:04.50", "t1": "02:07.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium close-up of the nobleman looking down pensively at the open execution clause on the table.", "zone": "", "heat": 0.0}, {"id": "E37-C068", "t0": "02:04.80", "t1": "02:06.50", "kind": "DIALOGUE", "speaker": "NOBLEMAN", "emotion": "Musing", "text": "She was always stubborn.", "zone": "", "heat": 0.0}, {"id": "E37-C069", "t0": "02:07.00", "t1": "02:12.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Clarissa's face hardening with bitter resentment.", "zone": "", "heat": 0.0}, {"id": "E37-C070", "t0": "02:07.50", "t1": "02:12.00", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Bitter, Cold", "text": "That was her greatest mistake. She could have accepted what happened. She could have disappeared quietly.", "zone": "", "heat": 0.2}, {"id": "E37-C071", "t0": "02:12.50", "t1": "02:16.00", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Clarissa rises from her armchair holding a cut crystal glass filled with dark red wine, pacing toward the fireplace.", "zone": "", "heat": 0.0}, {"id": "E37-C072", "t0": "02:12.50", "t1": "02:21.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium tracking shot showing Clarissa standing tall beside her husband, her posture regal and vindictive.", "zone": "", "heat": 0.0}, {"id": "E37-C073", "t0": "02:14.00", "t1": "02:21.00", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Venomous Monologue", "text": "Instead she married a nobody, played healer to peasants, challenged people above her. And now the whole county will watch her pay for it.", "zone": "", "heat": 0.5}, {"id": "E37-C074", "t0": "02:21.50", "t1": "02:27.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Tight close-up on Clarissa's face glowing in the firelight. Her lips curl into a merciless smile as she lifts the crystal glass to her mouth and drinks.", "zone": "", "heat": 0.0}, {"id": "E37-C075", "t0": "02:22.50", "t1": "02:26.50", "kind": "DIALOGUE", "speaker": "CLARISSA", "emotion": "Chilling Proclamation", "text": "Let them see what happens when a woman forgets her place.", "zone": "", "heat": 0.0}, {"id": "E37-C076", "t0": "02:25.50", "t1": "02:28.00", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Clarissa takes a slow sip of the red wine, her eyes gleaming with dark relish.", "zone": "", "heat": 0.0}, {"id": "E37-C077", "t0": "02:27.50", "t1": "02:36.47", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Slow push-in on the dark polished tabletop where the open invitation lies beside the wax seal. The bold Gothic lettering \"EXECUTION CLAUSE\" sits beneath the gold crest, while the fire dances reflected on the mahogany.", "zone": "cliff", "heat": 0.0}, {"id": "E37-C078", "t0": "02:28.00", "t1": "02:36.47", "kind": "SFX", "speaker": "", "emotion": "", "text": "A deep, ominous cello rumble builds alongside the crackle of the fireplace into an unresolved, tension-filled cliffhanger sting before fading out.", "zone": "cliff", "heat": 0.3}]}], "P09": [{"episode": 3, "start": "01:36.50", "end": "02:25.75", "heading": "INT. CATHEDRAL AISLE – CONTINUOUS", "file": "episode-003-Episode 1671705.txt", "cues": [{"id": "E03-C081", "t0": "01:36.50", "t1": "01:38.40", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium close-up on the Noble Matriarch shrieking in exasperation from the altar steps.", "zone": "hook", "heat": 0.5}, {"id": "E03-C082", "t0": "01:36.50", "t1": "01:38.50", "kind": "DIALOGUE", "speaker": "NOBLE MATRIARCH", "emotion": "Furious, Hysterical", "text": "You cannot interfere in a family matter!", "zone": "hook", "heat": 0.2}, {"id": "E03-C083", "t0": "01:38.40", "t1": "01:40.80", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up of Juliana's elderly father looking down, gripping his hands nervously with profound guilt.", "zone": "hook", "heat": 0.0}, {"id": "E03-C084", "t0": "01:38.80", "t1": "01:40.80", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "O.S.) (Deep, Resonant", "text": "I can...", "zone": "hook", "heat": 0.0}, {"id": "E03-C085", "t0": "01:40.80", "t1": "01:43.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of guests in the pews whispering and reacting in hushed shock.", "zone": "", "heat": 0.0}, {"id": "E03-C086", "t0": "01:40.80", "t1": "01:43.80", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "O.S.) (Stern, Accusing", "text": "...when your family is dragging a defenseless woman from a church.", "zone": "", "heat": 0.5}, {"id": "E03-C087", "t0": "01:43.00", "t1": "01:45.90", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Two-shot profile of The Bearded Stranger and Lady Juliana framed against the illuminated stained-glass rose window.", "zone": "", "heat": 0.0}, {"id": "E03-C088", "t0": "01:44.20", "t1": "01:47.40", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Solemn, Gentle", "text": "You shouldn't have to beg anybody...", "zone": "", "heat": 0.0}, {"id": "E03-C089", "t0": "01:45.90", "t1": "01:48.80", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Juliana looking up into his eyes, moved to the core.", "zone": "", "heat": 0.0}, {"id": "E03-C090", "t0": "01:47.40", "t1": "01:49.00", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "O.S.) (Affirming, Sincere", "text": "...to remember your worth.", "zone": "", "heat": 0.0}, {"id": "E03-C091", "t0": "01:48.80", "t1": "01:50.80", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on The Bearded Stranger's rugged, bearded face looking down at her with tender reverence.", "zone": "", "heat": 0.0}, {"id": "E03-C092", "t0": "01:50.80", "t1": "01:52.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Juliana, her lips parting in quiet astonishment.", "zone": "", "heat": 0.0}, {"id": "E03-C093", "t0": "01:50.90", "t1": "01:52.50", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Whispering, Bewildered", "text": "Why are you doing this?", "zone": "", "heat": 0.0}, {"id": "E03-C094", "t0": "01:52.50", "t1": "01:54.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on The Bearded Stranger, completely unfazed.", "zone": "", "heat": 0.0}, {"id": "E03-C095", "t0": "01:52.80", "t1": "01:54.10", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Simple, Certain", "text": "Because I want to.", "zone": "", "heat": 0.0}, {"id": "E03-C096", "t0": "01:54.20", "t1": "01:56.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Juliana's father wringing his gold ring, eyes heavy with regret.", "zone": "", "heat": 0.0}, {"id": "E03-C097", "t0": "01:56.00", "t1": "01:57.90", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot on The Bearded Stranger slipping his hand into his coat pocket.", "zone": "", "heat": 0.0}, {"id": "E03-C098", "t0": "01:57.90", "t1": "01:59.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up of Juliana watching him with rapt, trembling anticipation.", "zone": "", "heat": 0.0}, {"id": "E03-C099", "t0": "01:59.20", "t1": "02:01.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Extreme close-up of The Bearded Stranger's rugged fingers holding up a simple, polished silver band.", "zone": "", "heat": 0.0}, {"id": "E03-C100", "t0": "01:59.80", "t1": "02:02.10", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "O.S.) (Honorable, Earnest", "text": "You came here to become a wife.", "zone": "", "heat": 0.0}, {"id": "E03-C101", "t0": "02:01.00", "t1": "02:03.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot on The Bearded Stranger extending the ring toward Juliana.", "zone": "", "heat": 0.0}, {"id": "E03-C102", "t0": "02:02.50", "t1": "02:04.20", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Quiet, Resolute", "text": "They took that from you.", "zone": "", "heat": 0.0}, {"id": "E03-C103", "t0": "02:03.20", "t1": "02:05.10", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Over-the-shoulder medium shot past The Bearded Stranger onto Gerald standing petrified and humiliated in the aisle.", "zone": "", "heat": 0.0}, {"id": "E03-C104", "t0": "02:05.10", "t1": "02:07.40", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium close-up on The Bearded Stranger presenting the ring directly to Juliana.", "zone": "", "heat": 0.0}, {"id": "E03-C105", "t0": "02:05.30", "t1": "02:07.30", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Earnest, Sincere", "text": "I am offering it back.", "zone": "", "heat": 0.0}, {"id": "E03-C106", "t0": "02:07.40", "t1": "02:10.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Juliana glancing down at the ring, breathless and overwhelmed.", "zone": "", "heat": 0.0}, {"id": "E03-C107", "t0": "02:07.70", "t1": "02:09.90", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Soft, Hesitant", "text": "You don't even know me.", "zone": "", "heat": 0.0}, {"id": "E03-C108", "t0": "02:10.20", "t1": "02:12.70", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on The Bearded Stranger's warm, piercing gaze.", "zone": "", "heat": 0.0}, {"id": "E03-C109", "t0": "02:10.40", "t1": "02:12.00", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Quiet, Steady", "text": "I know enough.", "zone": "", "heat": 0.0}, {"id": "E03-C110", "t0": "02:12.70", "t1": "02:15.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Full wide profile shot as The Bearded Stranger slowly and respectfully drops onto one knee before Lady Juliana.", "zone": "", "heat": 0.0}, {"id": "E03-C111", "t0": "02:13.20", "t1": "02:15.50", "kind": "ACTION", "speaker": "", "emotion": "", "text": "The Bearded Stranger sinks to one knee on the cathedral aisle, offering the silver ring up to Juliana.", "zone": "", "heat": 0.5}, {"id": "E03-C112", "t0": "02:14.80", "t1": "02:16.20", "kind": "SFX", "speaker": "", "emotion": "", "text": "A collective, stunned gasp rippling across the entire congregation.", "zone": "", "heat": 0.5}, {"id": "E03-C113", "t0": "02:15.50", "t1": "02:17.30", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of the Noble Matriarch, Gerald, and the Lady in Gold Gown frozen in sheer, jaw-dropped bewilderment.", "zone": "", "heat": 0.0}, {"id": "E03-C114", "t0": "02:17.30", "t1": "02:20.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Low-angle medium close-up of The Bearded Stranger on his knee, holding the silver ring high with steady dignity.", "zone": "", "heat": 0.0}, {"id": "E03-C115", "t0": "02:17.50", "t1": "02:20.30", "kind": "DIALOGUE", "speaker": "ALEXANDER", "emotion": "Solemn, Devoted", "text": "Lady Juliana... accept my hand.", "zone": "", "heat": 0.0}, {"id": "E03-C116", "t0": "02:20.50", "t1": "02:25.75", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up on Juliana looking down at him, fresh tears trailing down her flushed cheeks as a soft, trembling smile of hope touches her lips into a slow fade.", "zone": "cliff", "heat": 0.0}, {"id": "E03-C117", "t0": "02:20.50", "t1": "02:25.75", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Juliana gazes down at her rugged savior, overcome with emotion as the swelling score holds on the cliffhanger.", "zone": "cliff", "heat": 0.0}]}], "P10": [{"episode": 28, "start": "01:22.30", "end": "02:18.50", "heading": "INT. DUCHESS'S BEDCHAMBER – DAY", "file": "episode-028-Episode 1678581.txt", "cues": [{"id": "E28-C061", "t0": "01:21.00", "t1": "01:22.40", "kind": "SFX", "speaker": "", "emotion": "", "text": "Metallic clatter as the silver pendant bounces against the wooden baseboard.", "zone": "hook", "heat": 0.0}, {"id": "E28-C062", "t0": "01:22.30", "t1": "01:26.50", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Juliana being dragged further into the doorway, staring helplessly toward her discarded locket.", "zone": "hook", "heat": 0.5}, {"id": "E28-C063", "t0": "01:22.50", "t1": "01:24.40", "kind": "DIALOGUE", "speaker": "JULIANA", "emotion": "Heartbroken", "text": "My mother's locket!", "zone": "hook", "heat": 0.0}, {"id": "E28-C064", "t0": "01:26.50", "t1": "01:31.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Catherine walking toward the fallen leather-bound book and kneeling gracefully to pick it up.", "zone": "", "heat": 0.2}, {"id": "E28-C065", "t0": "01:28.00", "t1": "01:31.00", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Catherine lifts the heavy herbarium, dusting off the cover before opening its aged parchment pages.", "zone": "", "heat": 0.0}, {"id": "E28-C066", "t0": "01:31.00", "t1": "01:33.80", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Tight close-up of Catherine reading the elegant cursive script inside the front cover.", "zone": "", "heat": 0.0}, {"id": "E28-C067", "t0": "01:31.20", "t1": "01:32.80", "kind": "DIALOGUE", "speaker": "CATHERINE", "emotion": "Intrigued, Murmuring", "text": "Juliana...", "zone": "", "heat": 0.0}, {"id": "E28-C068", "t0": "01:33.80", "t1": "01:35.00", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Extreme close-up on the handwritten inscription: 'Juliana Ashcroft'.", "zone": "", "heat": 0.0}, {"id": "E28-C069", "t0": "01:35.00", "t1": "01:37.40", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Medium shot of Juliana freezing in the doorway as she sees Catherine opening her mother's book.", "zone": "", "heat": 0.0}, {"id": "E28-C070", "t0": "01:35.20", "t1": "01:37.00", "kind": "ACTION", "speaker": "", "emotion": "", "text": "Juliana gasps in horror, realizing her secret identity has been laid bare.", "zone": "", "heat": 0.2}, {"id": "E28-C071", "t0": "01:37.40", "t1": "01:41.20", "kind": "CAMERA", "speaker": "", "emotion": "", "text": "Close-up of Catherine raising her gaze slowly from the book, a wicked, triumphant grin spreading across her face.", "zone": "", "heat": 0.0}, {"id": "E28-C072", "t0": "01     <div class="row"><b>Hook</b><div class="hook">${esc(p.hook)}</div></div>
    <div class="row"><b>Cliffhanger</b><div class="cliff">${esc(p.cliffhanger)}</div></div>
    <div class="row"><b>Why</b><div>${esc(p.why)}</div></div>
    <div class="row"><b>Post order</b><div class="mut">${esc(p.post_reason)}</div></div>
    ${p.llm && p.llm.cold_viewer_test ? `<div class="row"><b>Cold viewer</b><div class="mut">${esc(p.llm.cold_viewer_test)}</div></div>` : ''}
    <div class="bars">${bar('hook', p.scores.hook)}${bar('cliff', p.scores.cliff)}${bar('standalone', p.scores.standalone)}${bar('premise', p.scores.premise)}</div>
    ${p.flags.length ? `<div class="flags">⚠ ${p.flags.map(esc).join('<br>⚠ ')}</div>` : ''}
    <details><summary>Script excerpt (<span class="hook">■ hook window</span> · <span class="cliff">■ cliffhanger window</span>)</summary>
      ${DATA.excerpts[p.id].map(seg => `<div class="seghead">Ep ${seg.episode} · ${seg.start}–${seg.end} · ${esc(seg.heading)} <span class="mut">(${esc(seg.file)})</span></div>
      <table>${seg.cues.map(c => `<tr class="z-${c.zone}"><td class="t">${c.t0}</td><td class="k">${c.kind === 'DIALOGUE' ? esc(c.speaker) + (c.emotion ? ' <span class="mut">(' + esc(c.emotion) + ')</span>' : '') : c.kind}</td><td>${esc(c.text)}</td></tr>`).join('')}</table>`).join('')}
    </details>
  </div>`).join('') || '<div class="mut">No promos match.</div>';
}
['#q','#kind','#sort','#maxep','#noflag'].forEach(s => $(s).addEventListener('input', render));
render();
</script></body></html>
